services:
  - type: web
    name: bro-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COMPOSIO_API_KEY
        sync: false
      - key: HORDE_API_KEY
        sync: false
      - key: BRO_ACCESS_CODE
        sync: false
      - key: BRO_WORKDIR
        value: /opt/render/project/src/bro-work
