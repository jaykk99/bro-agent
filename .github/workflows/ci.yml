# CI: run the full pytest suite on every push and pull request to main.
#
# The suite is dependency-free except for the production requirements
# (langchain_core comes in via langchain-openai) plus pytest/httpx.
# test_horde.py is part of the suite, not skipped: it only needs
# langchain_core, which requirements.txt already installs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: python -m pytest tests/ -q
